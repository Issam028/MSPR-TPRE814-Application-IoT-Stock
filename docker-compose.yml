services:
  db_Brazil:
    image: mysql:8.4
    container_name: mysql_Brazil
    restart: always
    environment:
      # Configuration de la base demandée [cite: 147, 183]
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-brazil_db}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      # Chemin mis à jour vers ton fichier init.sql
      - ./country/init.sql:/docker-entrypoint-initdb.d/init.sql
      # Persistance des données pour ne rien perdre au redémarrage
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  db_Colombia:
    image: mysql:8.4
    container_name: mysql_Colombia
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${COLOMBIA_DATABASE:-colombia_db}
    ports:
      - "${COLOMBIA_MYSQL_PORT:-3308}:3306"
    volumes:
      - ./country/init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql_colombia_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  db_Ecuador:
    image: mysql:8.4
    container_name: mysql_Ecuador
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${ECUADOR_DATABASE:-ecuador_db}
    ports:
      - "${ECUADOR_MYSQL_PORT:-3309}:3306"
    volumes:
      - ./country/init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql_ecuador_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  api_brazil:
    build: ./country/api
    container_name: api_brazil
    restart: always
    ports:
      - "${BRAZIL_API_PORT:-3000}:3000"
    depends_on:
      db_Brazil:
        condition: service_healthy
    environment:
      PORT: 3000
      DB_HOST: ${BRAZIL_DB_HOST:-db_Brazil}
      DB_PORT: ${BRAZIL_DB_PORT:-3306}
      DB_USER: ${BRAZIL_DB_USER:-root}
      DB_PASS: ${BRAZIL_DB_PASS:-root}
      DB_NAME: ${BRAZIL_DB_NAME:-brazil_db}
      ALERT_EMAIL_MODE: ${ALERT_EMAIL_MODE:-log}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-responsable-brazil@example.com}
      ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM:-futurekawa-alerts@example.com}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      ALERT_TEMPERATURE_TARGET: ${BRAZIL_ALERT_TEMPERATURE_TARGET:-29}
      ALERT_TEMPERATURE_TOLERANCE: ${BRAZIL_ALERT_TEMPERATURE_TOLERANCE:-3}
      ALERT_HUMIDITE_TARGET: ${BRAZIL_ALERT_HUMIDITE_TARGET:-55}
      ALERT_HUMIDITE_TOLERANCE: ${BRAZIL_ALERT_HUMIDITE_TOLERANCE:-2}

  api_colombia:
    build: ./country/api
    container_name: api_colombia
    restart: always
    ports:
      - "${COLOMBIA_API_PORT:-3002}:3000"
    depends_on:
      db_Colombia:
        condition: service_healthy
    environment:
      PORT: 3000
      DB_HOST: ${COLOMBIA_DB_HOST:-db_Colombia}
      DB_PORT: ${COLOMBIA_DB_PORT:-3306}
      DB_USER: ${COLOMBIA_DB_USER:-root}
      DB_PASS: ${COLOMBIA_DB_PASS:-root}
      DB_NAME: ${COLOMBIA_DB_NAME:-colombia_db}
      ALERT_EMAIL_MODE: ${ALERT_EMAIL_MODE:-log}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-responsable-colombia@example.com}
      ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM:-futurekawa-alerts@example.com}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      ALERT_TEMPERATURE_TARGET: ${COLOMBIA_ALERT_TEMPERATURE_TARGET:-26}
      ALERT_TEMPERATURE_TOLERANCE: ${COLOMBIA_ALERT_TEMPERATURE_TOLERANCE:-3}
      ALERT_HUMIDITE_TARGET: ${COLOMBIA_ALERT_HUMIDITE_TARGET:-80}
      ALERT_HUMIDITE_TOLERANCE: ${COLOMBIA_ALERT_HUMIDITE_TOLERANCE:-2}

  api_ecuador:
    build: ./country/api
    container_name: api_ecuador
    restart: always
    ports:
      - "${ECUADOR_API_PORT:-3003}:3000"
    depends_on:
      db_Ecuador:
        condition: service_healthy
    environment:
      PORT: 3000
      DB_HOST: ${ECUADOR_DB_HOST:-db_Ecuador}
      DB_PORT: ${ECUADOR_DB_PORT:-3306}
      DB_USER: ${ECUADOR_DB_USER:-root}
      DB_PASS: ${ECUADOR_DB_PASS:-root}
      DB_NAME: ${ECUADOR_DB_NAME:-ecuador_db}
      ALERT_EMAIL_MODE: ${ALERT_EMAIL_MODE:-log}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-responsable-ecuador@example.com}
      ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM:-futurekawa-alerts@example.com}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      ALERT_TEMPERATURE_TARGET: ${ECUADOR_ALERT_TEMPERATURE_TARGET:-31}
      ALERT_TEMPERATURE_TOLERANCE: ${ECUADOR_ALERT_TEMPERATURE_TOLERANCE:-3}
      ALERT_HUMIDITE_TARGET: ${ECUADOR_ALERT_HUMIDITE_TARGET:-60}
      ALERT_HUMIDITE_TOLERANCE: ${ECUADOR_ALERT_HUMIDITE_TOLERANCE:-2}

  api_central:
    build: ./central/api
    container_name: api_central
    restart: always
    ports:
      - "${CENTRAL_API_PORT:-3001}:3001"
    depends_on:
      - api_brazil
      - api_colombia
      - api_ecuador
    environment:
      PORT: 3001
      BRAZIL_API_URL: ${BRAZIL_API_URL:-http://api_brazil:3000}
      COLOMBIA_API_URL: ${COLOMBIA_API_URL:-http://api_colombia:3000}
      ECUADOR_API_URL: ${ECUADOR_API_URL:-http://api_ecuador:3000}

  app_central:
    build: ./central/app
    container_name: app_central
    restart: always
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      - api_central

  mqtt_broker:
    image: eclipse-mosquitto:2
    container_name: mqtt_broker
    restart: always
    profiles:
      - dev
    ports:
      - "${MQTT_PORT:-1883}:1883"
    volumes:
      - ./iot/mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  mqtt_bridge:
    build: ./iot/mqtt-bridge
    container_name: mqtt_bridge
    restart: always
    profiles:
      - dev
    depends_on:
      - mqtt_broker
      - api_brazil
    environment:
      MQTT_HOST: ${MQTT_HOST:-mqtt_broker}
      MQTT_PORT: ${MQTT_INTERNAL_PORT:-1883}
      MQTT_TOPIC: ${MQTT_TOPIC:-futurekawa/mesures}
      MQTT_CLIENT_ID: ${MQTT_CLIENT_ID:-futurekawa-mqtt-bridge}
      API_URL: ${MQTT_BRIDGE_API_URL:-http://api_brazil:3000/mesures}

  iot_simulator:
    build: ./simulator
    container_name: iot_simulator
    restart: always
    profiles:
      - dev
    depends_on:
      - api_brazil
    environment:
      SIMULATOR_API_URL: ${SIMULATOR_API_URL:-http://api_brazil:3000}
      SIMULATOR_ENTREPOT_ID: ${SIMULATOR_ENTREPOT_ID:-COFFEE-01}
      SIMULATOR_INTERVAL_MS: ${SIMULATOR_INTERVAL_MS:-5000}
      SIMULATOR_MODE: ${SIMULATOR_MODE:-mixed}

volumes:
  mysql_data:
  mysql_colombia_data:
  mysql_ecuador_data:
